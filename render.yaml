services:
  - type: web
    name: sherlock-combs
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_API_KEY
        sync: false            # you paste the key in the dashboard; it is never stored in git
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_FAST_MODEL
        value: gemini-flash-lite-latest
      - key: EMBEDDING_BACKEND
        value: gemini
